# Real Sandbox on the office server.
# Start:   docker compose --env-file .env up -d
# Logs:    docker compose logs -f api
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: realsandbox
      POSTGRES_USER: realsandbox
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realsandbox -d realsandbox"]
      interval: 10s
      retries: 10

  api:
    build: ../server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Migrations run as the database owner; the app runs as its own restricted user, so
      # row-level security keeps every company's data separate.
      MIGRATION_DATABASE_URL: postgres://realsandbox:${DB_PASSWORD}@db:5432/realsandbox
      DATABASE_URL: postgres://rs_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}@db:5432/realsandbox
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      INVOICE_MODEL: ${INVOICE_MODEL:-claude-sonnet-5-5}
      # Reading breakdown emails and messages (the store, fault and call log number).
      BREAKDOWN_MODEL: ${BREAKDOWN_MODEL:-claude-haiku-5-5}
      # Finding stores' addresses on the map: Google with a key (best for shop addresses), otherwise OpenStreetMap (free).
      GOOGLE_MAPS_KEY: ${GOOGLE_MAPS_KEY:-}
      NOMINATIM_EMAIL: ${NOMINATIM_EMAIL:-}
      # Sending email (site reports, statements, documents for a job): the company's mailbox, e.g. Gmail with an app password.
      MAIL_URL: ${MAIL_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # The address phones and clients reach the server on (the tunnel's), for links to documents sent on WhatsApp.
      PUBLIC_URL: ${PUBLIC_URL:-}
      # The WhatsApp link (below) signs in to the server with this key.
      WA_BRIDGE_KEY: ${WA_BRIDGE_KEY:?set WA_BRIDGE_KEY in .env (openssl rand -hex 24)}
      # The official WhatsApp number option: Real Sandbox's own sign-up with Meta (see OFFICE-SERVER.md).
      # Empty: companies use their own phone (scan a QR code), which always works.
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_CONFIG_ID: ${META_CONFIG_ID:-}
      WA_VERIFY_TOKEN: ${WA_VERIFY_TOKEN:-}
      # How the last backup went, for the owner's dashboard and the CEO's settings.
      BACKUP_STATUS: /backups/status.json
    volumes:
      - uploads:/data/uploads
      - ${BACKUP_DIR:-./backups}:/backups:ro
    ports:
      - "127.0.0.1:8080:8080"   # only reachable on the server itself; phones come in through the tunnel

  # Every day at 01:30 (or as soon as the server is back on if it was off): the database and the files,
  # kept on this server (BACKUP_DIR: best on a second disk) and, encrypted here first, in the cloud.
  # See docs/OFFICE-SERVER.md, "Backups".
  backup:
    build: ./backup
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PGPASSWORD: ${DB_PASSWORD}
      TZ: Africa/Johannesburg
      BACKUP_TIME: ${BACKUP_TIME:-01:30}
      # The cloud (S3-type storage: Cloudflare R2, Backblaze B2, Amazon S3, Wasabi). Empty CLOUD_BUCKET: no cloud copy.
      CLOUD_BUCKET: ${CLOUD_BUCKET:-}
      CLOUD_FOLDER: ${CLOUD_FOLDER:-realsandbox}
      CLOUD_PHOTOS: ${CLOUD_PHOTOS:-1}
      RCLONE_CONFIG_CLOUD_TYPE: s3
      RCLONE_CONFIG_CLOUD_PROVIDER: ${CLOUD_PROVIDER:-Cloudflare}
      RCLONE_CONFIG_CLOUD_ACCESS_KEY_ID: ${CLOUD_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_CLOUD_SECRET_ACCESS_KEY: ${CLOUD_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_CLOUD_ENDPOINT: ${CLOUD_ENDPOINT:-}
      RCLONE_CONFIG_CLOUD_REGION: ${CLOUD_REGION:-auto}
      RCLONE_CONFIG_CLOUD_NO_CHECK_BUCKET: "true"
      # Everything is encrypted with this before it leaves the server. Keep a copy somewhere safe (not only on
      # this server): without it the cloud backup cannot be read.
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
    volumes:
      - uploads:/data/uploads:ro
      - ${BACKUP_DIR:-./backups}:/backups

  # The WhatsApp link for every company that chose "our own phone" (see whatsapp-bridge/bridge.mjs).
  # Always running; nothing to do per company: the CEO presses "Show the code" in the app and scans it.
  whatsapp:
    build: ../whatsapp-bridge
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_URL: http://api:8080
      WA_BRIDGE_KEY: ${WA_BRIDGE_KEY:?set WA_BRIDGE_KEY in .env (openssl rand -hex 24)}
    volumes:
      - wa-auth:/data

  # Secure link so phones can reach the server from anywhere, with no open ports on the office router.
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - api
    profiles: ["tunnel"]

volumes:
  db-data:
  uploads:
  wa-auth:
